<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>E-Tamu Digital</title>
    
    <!-- CSS & Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; overflow: hidden; }
        .app-shell {
            max-width: 600px; margin: 0 auto; background: white;
            height: 100vh; display: flex; flex-direction: column;
            box-shadow: 0 0 50px rgba(0,0,0,0.1);
        }
        .main-content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 100px; }
        .nav-bar {
            height: 70px; background: white; border-top: 1px solid #e2e8f0;
            display: flex; justify-content: space-around; align-items: center;
            position: relative; z-index: 10;
        }
        .btn-add {
            width: 60px; height: 60px; background: #4f46e5; color: white;
            border-radius: 20px; display: flex; items-center: center; justify-content: center;
            position: absolute; top: -30px; left: 50%; transform: translateX(-50%);
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
        }
        #signature-pad { border: 2px dashed #cbd5e1; border-radius: 12px; background: #f8fafc; width: 100%; height: 200px; touch-action: none; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="app-shell">
        <!-- Header -->
        <header class="p-5 border-b flex justify-between items-center bg-white">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 p-2 rounded-xl text-white">
                    <span class="material-icons">face</span>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-none">E-Tamu</h1>
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">SMK QUEEN AL-FALAH</p>
                </div>
            </div>
            <div id="status-badge" class="px-3 py-1 bg-amber-100 text-amber-700 text-[10px] font-bold rounded-full">OFFLINE</div>
        </header>

        <!-- Area Konten Utama -->
        <main id="app-content" class="main-content custom-scrollbar">
            <!-- Konten dimuat di sini oleh JS -->
            <div class="flex items-center justify-center h-full">
                <p class="text-slate-400 animate-pulse">Memuat aplikasi...</p>
            </div>
        </main>

        <!-- Navigasi Bawah -->
        <nav class="nav-bar">
            <button onclick="router.navigate('dashboard')" class="flex flex-col items-center text-indigo-600">
                <span class="material-icons">grid_view</span>
                <span class="text-[10px] font-bold">Beranda</span>
            </button>

            <button onclick="router.navigate('form')" class="btn-add">
                <span class="material-icons text-3xl">add</span>
            </button>

            <button onclick="router.navigate('history')" class="flex flex-col items-center text-slate-400">
                <span class="material-icons">history</span>
                <span class="text-[10px] font-bold">Riwayat</span>
            </button>
        </nav>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-6 py-3 rounded-full text-sm font-bold hidden z-50"></div>

    <script>
        // --- DATA & STORAGE ---
        const STORAGE_KEY = 'etamu_data_v3';
        const db = {
            getGuests: () => JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'),
            saveGuest: (guest) => {
                const guests = db.getGuests();
                guests.unshift(guest);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(guests));
            }
        };

        // --- STATE APLIKASI ---
        let state = {
            view: 'dashboard',
            guests: db.getGuests()
        };

        // --- SISTEM ROUTING ---
        const router = {
            navigate: (view) => {
                state.view = view;
                router.render();
            },
            render: () => {
                const content = document.getElementById('app-content');
                state.guests = db.getGuests(); // Refresh data

                if (state.view === 'dashboard') {
                    content.innerHTML = views.dashboard();
                    setTimeout(initChart, 100);
                } else if (state.view === 'form') {
                    content.innerHTML = views.form();
                    setTimeout(initSignature, 100);
                } else if (state.view === 'history') {
                    content.innerHTML = views.history();
                }
                
                // Update Warna Navigasi
                document.querySelectorAll('nav button').forEach((btn, idx) => {
                    if(idx === 1) return; // Skip tombol plus
                    btn.classList.toggle('text-indigo-600', (idx === 0 && state.view === 'dashboard') || (idx === 2 && state.view === 'history'));
                    btn.classList.toggle('text-slate-400', !((idx === 0 && state.view === 'dashboard') || (idx === 2 && state.view === 'history')));
                });
            }
        };

        // --- VIEWS (TAMPILAN) ---
        const views = {
            dashboard: () => {
                const today = new Date().toISOString().split('T')[0];
                const todayTamu = state.guests.filter(g => g.date === today).length;
                
                return `
                    <div class="fade-in space-y-6">
                        <div>
                            <h2 class="text-2xl font-bold text-slate-800">Halo, Admin!</h2>
                            <p class="text-sm text-slate-500">Berikut ringkasan kunjungan hari ini.</p>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div class="bg-indigo-600 p-5 rounded-3xl text-white">
                                <p class="text-[10px] font-bold uppercase opacity-80">Hari Ini</p>
                                <h3 class="text-4xl font-bold">${todayTamu}</h3>
                                <p class="text-[10px] mt-1 italic">Tamu terdaftar</p>
                            </div>
                            <div class="bg-white border p-5 rounded-3xl">
                                <p class="text-[10px] font-bold text-slate-400 uppercase">Total Semua</p>
                                <h3 class="text-4xl font-bold text-indigo-600">${state.guests.length}</h3>
                            </div>
                        </div>

                        <div class="bg-white border p-5 rounded-3xl shadow-sm">
                            <h4 class="text-sm font-bold mb-4 flex items-center gap-2">
                                <span class="material-icons text-indigo-600 text-sm">analytics</span>
                                Statistik Kunjungan
                            </h4>
                            <canvas id="visitChart" height="150"></canvas>
                        </div>
                    </div>
                `;
            },
            form: () => `
                <div class="fade-in space-y-5">
                    <h2 class="text-xl font-bold">Tambah Tamu Baru</h2>
                    <form onsubmit="handleSimpan(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1">Nama Lengkap</label>
                            <input type="text" id="fname" required class="w-full p-3 rounded-xl border focus:outline-indigo-500" placeholder="Contoh: Budi Santoso">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1">Asal Instansi</label>
                            <input type="text" id="fagency" required class="w-full p-3 rounded-xl border focus:outline-indigo-500" placeholder="Contoh: PT. Maju Jaya">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1">Keperluan</label>
                            <textarea id="fpurpose" required class="w-full p-3 rounded-xl border focus:outline-indigo-500" rows="3" placeholder="Contoh: Koordinasi Kurikulum"></textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1">Tanda Tangan</label>
                            <canvas id="signature-pad"></canvas>
                            <button type="button" onclick="clearSig()" class="text-[10px] font-bold text-indigo-600 mt-1 uppercase tracking-wider">Hapus Ulang</button>
                        </div>
                        <button type="submit" class="w-full bg-indigo-600 text-white p-4 rounded-2xl font-bold shadow-lg">Simpan Data Tamu</button>
                    </form>
                </div>
            `,
            history: () => `
                <div class="fade-in space-y-4">
                    <h2 class="text-xl font-bold">Riwayat Tamu</h2>
                    ${state.guests.length === 0 ? '<p class="text-center text-slate-400 py-10">Belum ada riwayat.</p>' : ''}
                    <div class="space-y-3">
                        ${state.guests.map(g => `
                            <div class="bg-white border p-4 rounded-2xl flex items-center gap-4">
                                <div class="bg-slate-100 p-2 rounded-full text-slate-400">
                                    <span class="material-icons">person</span>
                                </div>
                                <div class="flex-1">
                                    <h4 class="font-bold text-sm text-slate-800">${g.name}</h4>
                                    <p class="text-[10px] text-slate-500">${g.agency} | ${g.time}</p>
                                </div>
                                <div class="text-right">
                                    <p class="text-[9px] font-bold text-indigo-600 uppercase">${g.date}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `
        };

        // --- FUNGSI CHART (DENGAN FAIL-SAFE) ---
        function initChart() {
            const ctx = document.getElementById('visitChart');
            if (!ctx || typeof Chart === 'undefined') return;

            const tamuPerBulan = [0, 0, 0, 0, 0, 0];
            const labels = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun'];

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Tamu',
                        data: [12, 19, 3, 5, 2, 3], // Contoh statis, bisa dihubungkan ke data real
                        borderColor: '#4f46e5',
                        tension: 0.4,
                        fill: true,
                        backgroundColor: 'rgba(79, 70, 229, 0.1)'
                    }]
                },
                options: { plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { grid: { display: false } } } }
            });
        }

        // --- FUNGSI TANDA TANGAN ---
        let canvas, ctx, drawing = false;
        function initSignature() {
            canvas = document.getElementById('signature-pad');
            if(!canvas) return;
            ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            ctx.lineWidth = 3;
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#1e293b';

            const start = (e) => { drawing = true; ctx.beginPath(); move(e); };
            const stop = () => drawing = false;
            const move = (e) => {
                if(!drawing) return;
                const rect = canvas.getBoundingClientRect();
                const x = (e.clientX || e.touches[0].clientX) - rect.left;
                const y = (e.clientY || e.touches[0].clientY) - rect.top;
                ctx.lineTo(x, y);
                ctx.stroke();
            };

            canvas.onmousedown = start; canvas.ontouchstart = start;
            window.onmouseup = stop; window.ontouchend = stop;
            canvas.onmousemove = move; canvas.ontouchmove = move;
        }

        function clearSig() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

        // --- HANDLING SIMPAN ---
        function handleSimpan(e) {
            e.preventDefault();
            const name = document.getElementById('fname').value;
            const agency = document.getElementById('fagency').value;
            const purpose = document.getElementById('fpurpose').value;

            const now = new Date();
            const guest = {
                id: Date.now(),
                name,
                agency,
                purpose,
                date: now.toISOString().split('T')[0],
                time: now.getHours() + ':' + now.getMinutes()
            };

            db.saveGuest(guest);
            showToast("Berhasil disimpan!");
            router.navigate('dashboard');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 2000);
        }

        // --- JALANKAN APLIKASI ---
        window.onload = () => {
            router.render(); // Jalankan render pertama kali
            console.log("Aplikasi siap.");
        };
    </script>
</body>
</html>
