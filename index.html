<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>E-Tamu Digital - SMK Queen Al-Falah</title>
    
    <!-- LIBRARIES -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/docx@7.1.0/build/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; overflow: hidden; -webkit-tap-highlight-color: transparent; }
        .app-shell { max-width: 500px; margin: 0 auto; background: white; height: 100vh; display: flex; flex-direction: column; box-shadow: 0 0 50px rgba(0,0,0,0.1); }
        .main-content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 100px; scroll-behavior: smooth; }
        .main-content::-webkit-scrollbar { width: 0px; }
        .nav-bar { height: 70px; background: white; border-top: 1px solid #f1f5f9; display: flex; justify-content: space-around; align-items: center; position: relative; z-index: 10; }
        .btn-add { width: 60px; height: 60px; background: #4f46e5; color: white; border-radius: 20px; display: flex; align-items: center; justify-content: center; position: absolute; top: -30px; left: 50%; transform: translateX(-50%); box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3); transition: transform 0.1s; }
        .btn-add:active { transform: translateX(-50%) scale(0.95); }
        #signature-pad { border: 2px dashed #cbd5e1; border-radius: 16px; background: white; width: 100%; height: 180px; touch-action: none; cursor: crosshair; }
        .qr-container { display: flex; justify-content: center; align-items: center; }
        .qr-container img { margin: 0 auto !important; border-radius: 8px; }
        .loading-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.95); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .id-card { background: white; border-radius: 24px; box-shadow: 0 20px 40px -10px rgba(0,0,0,0.15); overflow: hidden; border: 1px solid #e2e8f0; max-width: 340px; margin: 0 auto; position: relative;}
        .id-card-header { background: #4f46e5; padding: 20px; text-align: center; color: white; }
    </style>
</head>
<body>

    <!-- LAYER LOADING -->
    <div id="loader" class="loading-overlay">
        <div class="w-12 h-12 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin"></div>
        <p id="loader-text" class="mt-4 text-[10px] font-black text-slate-400 uppercase tracking-widest">Menyiapkan Sistem...</p>
    </div>

    <div class="app-shell relative" id="app-shell">
        <!-- HEADER ATAS -->
        <header class="p-5 border-b border-slate-100 flex justify-between items-center bg-white/90 backdrop-blur-sm sticky top-0 z-20">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 p-2 rounded-xl text-white shadow-lg shadow-indigo-100">
                    <span class="material-icons">qr_code_scanner</span>
                </div>
                <div>
                    <h1 class="font-extrabold text-base leading-none text-slate-800">E-Tamu</h1>
                    <p class="text-[9px] text-indigo-500 font-black uppercase tracking-widest mt-0.5">SMK Queen Al-Falah</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <div id="status-badge" class="px-2 py-1 bg-slate-100 text-[8px] font-black rounded-md uppercase">...</div>
                <!-- Tombol Menu Hanya untuk Admin -->
                <button id="menu-btn" onclick="toggleMenu(event)" class="w-8 h-8 flex items-center justify-center bg-slate-50 hover:bg-slate-100 rounded-lg text-slate-600 transition">
                    <span class="material-icons text-xl pointer-events-none">widgets</span>
                </button>
            </div>
        </header>

        <!-- MENU GANTUNG ADMIN -->
        <div id="quick-menu" class="hidden absolute top-20 right-5 w-48 bg-white shadow-2xl border border-slate-100 rounded-2xl p-2 z-50 animate-fade-in origin-top-right">
            <button onclick="handleAction('excel')" class="w-full flex items-center gap-3 p-3 text-[10px] font-bold text-slate-700 hover:bg-slate-50 rounded-xl uppercase transition">
                <span class="material-icons text-emerald-500 text-sm">file_download</span> Export Excel
            </button>
            <button onclick="handleAction('word')" class="w-full flex items-center gap-3 p-3 text-[10px] font-bold text-slate-700 hover:bg-slate-50 rounded-xl uppercase transition">
                <span class="material-icons text-blue-500 text-sm">description</span> Export Word
            </button>
            <hr class="my-1 border-slate-100">
            <button onclick="fetchDataDariFirebase()" class="w-full flex items-center gap-3 p-3 text-[10px] font-bold text-indigo-500 hover:bg-indigo-50 rounded-xl uppercase transition">
                <span class="material-icons text-sm">refresh</span> Refresh Data
            </button>
        </div>

        <!-- RUANG KONTEN UTAMA -->
        <main id="app-content" class="main-content">
            <!-- Disuntik oleh Router -->
        </main>

        <!-- NAVIGASI BAWAH ADMIN -->
        <nav class="nav-bar" id="main-nav">
            <button onclick="router.navigate('dashboard')" id="nav-dashboard" class="flex flex-col items-center transition">
                <span class="material-icons">home</span>
                <span class="text-[9px] font-black uppercase mt-1">Beranda</span>
            </button>
            <button onclick="router.navigate('form')" class="btn-add">
                <span class="material-icons text-3xl">add</span>
            </button>
            <button onclick="router.navigate('history')" id="nav-history" class="flex flex-col items-center transition">
                <span class="material-icons">history</span>
                <span class="text-[9px] font-black uppercase mt-1">Riwayat</span>
            </button>
        </nav>
    </div>

    <!-- POPUP TOAST -->
    <div id="toast" class="fixed bottom-28 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-5 py-2.5 rounded-full text-[9px] font-black hidden z-[60] flex items-center gap-2 uppercase tracking-widest shadow-2xl">
        <span class="material-icons text-sm text-green-400" id="toast-icon">check_circle</span>
        <span id="toast-msg">Notifikasi</span>
    </div>

    <script>
        // =========================================================
        // SETUP FIREBASE DATABASE MILIK ANDA
        // =========================================================
        const firebaseConfig = {
            apiKey: "AIzaSyCoNcCneR5g19dTRY7zAZzL53fCeOvpsCg",
            authDomain: "e-tamu-smk-queen.firebaseapp.com",
            projectId: "e-tamu-smk-queen",
            storageBucket: "e-tamu-smk-queen.firebasestorage.app",
            messagingSenderId: "948856871318",
            appId: "1:948856871318:web:7b5cad269762ced6f525b7"
        };
        firebase.initializeApp(firebaseConfig);
        const dbFirestore = firebase.firestore();

        // =========================================================
        // STATE & DETEKSI GUEST MODE
        // =========================================================
        let state = { view: 'dashboard', guests: [] };
        
        // MENDETEKSI APAKAH INI DIBUKA DARI SCAN QR CODE
        const urlParams = new URLSearchParams(window.location.search);
        const isGuestMode = urlParams.get('mode') === 'guest';

        // --- SISTEM PENGAMBILAN DATA (HANYA UNTUK ADMIN) ---
        async function fetchDataDariFirebase() {
            if (isGuestMode) return; // Tamu tidak boleh mendownload data
            
            toggleLoader(true, "Mengunduh Data...");
            try {
                const snapshot = await dbFirestore.collection("tamu").orderBy("timestamp", "desc").get();
                const data = [];
                snapshot.forEach(doc => { data.push({ id_firebase: doc.id, ...doc.data() }); });
                state.guests = data;
                if (state.view === 'dashboard' || state.view === 'history') {
                    router.render(null); 
                }
            } catch (error) {
                console.error(error);
                showToast("Gagal Terhubung Database", "error");
            } finally {
                toggleLoader(false);
            }
        }

        // --- SISTEM ROUTER ---
        const router = {
            navigate: (view, extra = null) => {
                if(isGuestMode && view !== 'form' && view !== 'success') return; // Tamu dilarang ke dashboard/history
                window.location.hash = view; 
                state.view = view;
                router.render(extra);
                closeMenu();
            },
            render: (extraData) => {
                const content = document.getElementById('app-content');
                
                // UI Navigasi Admin
                if(!isGuestMode) {
                    document.getElementById('nav-dashboard').className = `flex flex-col items-center transition ${state.view === 'dashboard' ? 'text-indigo-600' : 'text-slate-400'}`;
                    document.getElementById('nav-history').className = `flex flex-col items-center transition ${state.view === 'history' ? 'text-indigo-600' : 'text-slate-400'}`;
                }

                if (state.view === 'dashboard' && !isGuestMode) {
                    content.innerHTML = views.dashboard();
                    // URL QR CODE DIJAMIN TEMBUS KE FORM
                    const cleanUrl = window.location.href.split('#')[0].split('?')[0];
                    const qrUrl = cleanUrl + "?mode=guest"; 
                    setTimeout(() => { initChart(); generateQR("school-qr", qrUrl, 140); }, 100);

                } else if (state.view === 'form') {
                    content.innerHTML = views.form();
                    setTimeout(initSignature, 100);

                } else if (state.view === 'success') {
                    if (!extraData) return router.navigate(isGuestMode ? 'form' : 'dashboard');
                    content.innerHTML = views.success(extraData);
                    setTimeout(() => generateQR("visitor-qr", extraData.id, 140), 100);

                } else if (state.view === 'history' && !isGuestMode) {
                    content.innerHTML = views.history();
                }
            }
        };

        window.addEventListener('hashchange', () => {
            const hashView = window.location.hash.substring(1) || 'dashboard';
            if (state.view !== hashView) {
                if(hashView === 'success') { window.location.hash = isGuestMode ? 'form' : 'dashboard'; return; }
                state.view = hashView;
                router.render();
            }
        });

        // --- TEMPLATE TAMPILAN (VIEWS) ---
        const views = {
            dashboard: () => {
                const today = new Date().toISOString().split('T')[0];
                const tCount = state.guests.filter(g => g.date === today).length;
                return `
                <div class="fade-in space-y-6">
                    <div class="bg-indigo-600 p-6 rounded-[2rem] text-white shadow-xl shadow-indigo-100 flex justify-between items-center">
                        <div>
                            <p class="text-[10px] font-black uppercase opacity-70 tracking-widest mb-1">Tamu Hari Ini</p>
                            <h3 class="text-4xl font-extrabold">${tCount}</h3>
                        </div>
                        <div class="w-12 h-12 bg-white/20 rounded-2xl flex items-center justify-center">
                            <span class="material-icons text-3xl">people</span>
                        </div>
                    </div>

                    <div class="bg-white border border-slate-100 p-6 rounded-[2rem] text-center shadow-sm">
                        <h4 class="text-xs font-extrabold text-slate-800 mb-4 uppercase tracking-widest">QR CODE PENDAFTARAN</h4>
                        <div id="school-qr" class="qr-container bg-white p-3 border-4 border-slate-50 rounded-2xl inline-block mb-3"></div>
                        <p class="text-[10px] font-black text-indigo-500 uppercase tracking-widest">Arahkan Kamera HP Kesini</p>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-white border border-slate-100 p-5 rounded-[2rem] text-center flex flex-col items-center justify-center shadow-sm">
                            <h3 class="text-3xl font-extrabold text-slate-800">${state.guests.length}</h3>
                            <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mt-1">Total Database</p>
                        </div>
                        <div class="bg-white border border-slate-100 p-4 rounded-[2rem] relative shadow-sm">
                            <canvas id="visitChart"></canvas>
                        </div>
                    </div>
                </div>`;
            },
            
            form: () => `
                <div class="fade-in space-y-5">
                    <div>
                        <h2 class="text-xl font-extrabold text-slate-800">Buku Tamu</h2>
                        <p class="text-xs text-slate-400 font-medium">Mohon isi formulir dengan lengkap.</p>
                    </div>
                    <form onsubmit="handleSimpanKeFirebase(event)" class="space-y-4">
                        <input type="text" id="fname" required class="w-full p-4 bg-white border border-slate-200 rounded-2xl text-sm font-semibold text-slate-700 focus:border-indigo-500 outline-none transition shadow-sm" placeholder="Nama Lengkap Sesuai KTP *">
                        <input type="text" id="fagency" required class="w-full p-4 bg-white border border-slate-200 rounded-2xl text-sm font-semibold text-slate-700 focus:border-indigo-500 outline-none transition shadow-sm" placeholder="Asal Instansi/Alamat *">
                        <input type="tel" id="fphone" class="w-full p-4 bg-white border border-slate-200 rounded-2xl text-sm font-semibold text-slate-700 focus:border-indigo-500 outline-none transition shadow-sm" placeholder="No. Handphone / WA (Opsional)">
                        <textarea id="fpurpose" required class="w-full p-4 bg-white border border-slate-200 rounded-2xl text-sm font-semibold text-slate-700 focus:border-indigo-500 outline-none transition resize-none shadow-sm" rows="3" placeholder="Keperluan Kunjungan *"></textarea>
                        
                        <div class="bg-amber-50 border border-amber-200 p-4 rounded-2xl flex gap-3 items-start shadow-sm">
                            <span class="material-icons text-amber-500 mt-0.5">gpp_maybe</span>
                            <div>
                                <h4 class="text-xs font-extrabold text-amber-800 mb-1">Verifikasi Identitas</h4>
                                <p class="text-[10px] text-amber-700 font-semibold leading-relaxed">Petugas keamanan akan memfoto KTP/SIM asli Anda sebagai syarat masuk ke area sekolah.</p>
                            </div>
                        </div>

                        <div class="bg-white border border-slate-200 p-2 rounded-2xl shadow-sm">
                            <canvas id="signature-pad"></canvas>
                            <div class="flex justify-between items-center p-2 pt-3">
                                <span class="text-[9px] font-black text-slate-300 uppercase tracking-widest">Tanda Tangan *</span>
                                <button type="button" onclick="clearSig()" class="text-[9px] font-black text-indigo-600 uppercase tracking-widest bg-indigo-50 px-3 py-1 rounded-md active:scale-95 transition">Hapus</button>
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-95 transition-all text-white p-5 rounded-2xl font-extrabold shadow-xl shadow-indigo-200 tracking-widest text-xs uppercase mt-2">Daftar & Buat Tiket</button>
                    </form>
                </div>`,
            
            success: (g) => `
                <div class="fade-in space-y-5 pb-5 mt-4">
                    <div class="text-center mb-6">
                        <div class="bg-green-100 text-green-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3 shadow-lg shadow-green-50">
                            <span class="material-icons text-3xl">how_to_reg</span>
                        </div>
                        <h2 class="text-xl font-extrabold text-slate-800">Registrasi Berhasil!</h2>
                        <p class="text-[11px] font-black text-red-500 mt-2 uppercase tracking-wider animate-pulse bg-red-50 inline-block px-3 py-1 rounded-full border border-red-200">📸 WAJIB SCREENSHOT KARTU INI</p>
                    </div>

                    <div class="id-card">
                        <div class="id-card-header">
                            <h3 class="font-black tracking-[0.2em] text-lg">KARTU TAMU</h3>
                            <p class="text-[9px] uppercase tracking-widest opacity-80 mt-1">SMK Queen Al-Falah</p>
                        </div>
                        <div class="p-6 flex flex-col items-center bg-white relative">
                            <span class="material-icons absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-[150px] text-slate-50 opacity-50 z-0 pointer-events-none">verified_user</span>
                            <div id="visitor-qr" class="qr-container p-2 bg-white border-2 border-slate-100 rounded-xl mb-4 relative z-10 shadow-sm"></div>
                            <h2 class="text-lg font-extrabold text-slate-800 text-center uppercase leading-tight relative z-10 break-all">${g.name}</h2>
                            <p class="text-xs font-bold text-indigo-600 text-center mt-1 relative z-10">${g.agency}</p>
                            
                            <div class="w-full border-t-2 border-dashed border-slate-200 my-5 relative z-10"></div>
                            
                            <div class="w-full text-left space-y-3 relative z-10">
                                <div class="flex justify-between items-center border-b border-slate-50 pb-2">
                                    <span class="text-[9px] font-black text-slate-400 uppercase">Waktu Daftar</span>
                                    <span class="text-[10px] font-bold text-slate-700">${g.date} | ${g.time}</span>
                                </div>
                                <div class="flex justify-between items-center border-b border-slate-50 pb-2">
                                    <span class="text-[9px] font-black text-slate-400 uppercase">Keperluan</span>
                                    <span class="text-[10px] font-bold text-slate-700 max-w-[120px] text-right truncate">${g.purpose}</span>
                                </div>
                                <div class="flex justify-between items-center">
                                    <span class="text-[9px] font-black text-slate-400 uppercase">ID Sistem</span>
                                    <span class="text-[10px] font-bold text-slate-700">${g.id}</span>
                                </div>
                            </div>
                        </div>
                        <div class="bg-indigo-50 p-3 flex gap-2 items-center justify-center text-indigo-600">
                            <span class="material-icons text-sm">photo_camera</span>
                            <p class="text-[8px] font-black uppercase tracking-wider">Tunjukkan ke Petugas Keamanan</p>
                        </div>
                    </div>
                    
                    ${!isGuestMode ? `<button onclick="router.navigate('dashboard')" class="w-full py-4 mt-2 text-slate-400 hover:text-indigo-600 transition font-black text-[10px] uppercase tracking-widest">Selesai & Kembali</button>` : `<p class="text-center text-[9px] text-slate-400 font-bold mt-4 uppercase">Silakan tutup halaman web ini.</p>`}
                </div>`,
            
            history: () => `
                <div class="fade-in space-y-5">
                    <div class="flex justify-between items-center">
                        <h2 class="text-xl font-extrabold text-slate-800">Database Tamu</h2>
                        <span class="text-[9px] font-black text-indigo-500 bg-indigo-50 px-3 py-1.5 rounded-full uppercase tracking-widest">${state.guests.length} Data</span>
                    </div>
                    <div class="space-y-3">
                        ${state.guests.length === 0 ? '<div class="text-center py-20"><span class="material-icons text-5xl text-slate-200 mb-2">folder_open</span><p class="text-slate-400 text-[10px] font-black uppercase tracking-widest">Database Kosong</p></div>' : ''}
                        ${state.guests.map(g => `
                            <div class="bg-white border border-slate-100 p-4 rounded-3xl flex items-center gap-4 shadow-sm hover:shadow-md transition">
                                <div class="w-12 h-12 rounded-[1rem] bg-indigo-50 flex items-center justify-center text-indigo-600 font-black text-lg">${g.name.charAt(0).toUpperCase()}</div>
                                <div class="flex-1 min-w-0">
                                    <h4 class="font-extrabold text-sm text-slate-800 truncate">${g.name}</h4>
                                    <p class="text-[10px] text-slate-500 font-semibold truncate mt-0.5">${g.agency}</p>
                                    ${g.phone && g.phone !== '-' ? `<p class="text-[9px] text-slate-400 mt-1 flex items-center gap-1"><span class="material-icons" style="font-size: 10px;">call</span>${g.phone}</p>` : ''}
                                </div>
                                <div class="text-right">
                                    <span class="block text-[9px] font-black text-slate-400 uppercase">${g.date}</span>
                                    <span class="block text-[10px] font-bold text-indigo-500 mt-0.5">${g.time}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>`
        };

        // --- SISTEM PEMBUAT QR CODE ---
        function generateQR(id, text, size) {
            const el = document.getElementById(id);
            if(!el) return;
            el.innerHTML = "";
            if (typeof QRCode === 'undefined') return;
            new QRCode(el, { text, width: size, height: size, colorDark: "#1e1b4b", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H });
        }

        // --- SISTEM TANDA TANGAN ---
        let sigCanvas, sigCtx, drawing = false;
        function initSignature() {
            sigCanvas = document.getElementById('signature-pad');
            if(!sigCanvas) return;
            sigCtx = sigCanvas.getContext('2d');
            const rect = sigCanvas.getBoundingClientRect();
            sigCanvas.width = rect.width;
            sigCanvas.height = rect.height;
            sigCtx.lineWidth = 3; sigCtx.lineCap = 'round'; sigCtx.lineJoin = 'round'; sigCtx.strokeStyle = '#4f46e5';

            const getPos = (e) => {
                const r = sigCanvas.getBoundingClientRect();
                const clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches && e.touches.length > 0 ? e.touches[0].clientY : e.clientY;
                return { x: clientX - r.left, y: clientY - r.top };
            };
            const start = (e) => { e.preventDefault(); drawing = true; const p = getPos(e); sigCtx.beginPath(); sigCtx.moveTo(p.x, p.y); };
            const move = (e) => { if(!drawing) return; e.preventDefault(); const p = getPos(e); sigCtx.lineTo(p.x, p.y); sigCtx.stroke(); };
            const stop = (e) => { if(drawing) { e.preventDefault(); drawing = false; }};

            sigCanvas.addEventListener('mousedown', start); sigCanvas.addEventListener('mousemove', move); sigCanvas.addEventListener('mouseup', stop); sigCanvas.addEventListener('mouseout', stop);
            sigCanvas.addEventListener('touchstart', start, {passive: false}); sigCanvas.addEventListener('touchmove', move, {passive: false}); sigCanvas.addEventListener('touchend', stop);
        }
        function clearSig() { if(sigCtx) sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height); }

        // --- SISTEM GRAFIK ---
        function initChart() {
            const ctx = document.getElementById('visitChart');
            if(!ctx || typeof Chart === 'undefined') return;
            
            // Generate data 7 hari terakhir dari array guests
            const last7Days = Array.from({length: 7}, (_, i) => {
                const d = new Date(); d.setDate(d.getDate() - (6 - i));
                return d.toISOString().split('T')[0];
            });
            const counts = last7Days.map(date => state.guests.filter(g => g.date === date).length);
            const labels = ['H-6', 'H-5', 'H-4', 'H-3', 'H-2', 'H-1', 'Hr Ini'];

            new Chart(ctx, {
                type: 'line',
                data: { labels: labels, datasets: [{ data: counts, borderColor: '#4f46e5', tension: 0.4, fill: true, backgroundColor: 'rgba(79, 70, 229, 0.1)', borderWidth: 3, pointRadius: 4, pointBackgroundColor: '#4f46e5' }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { grid: { display: false }, ticks: { font: { size: 9, family: "'Plus Jakarta Sans', sans-serif" } } } } }
            });
        }

        // --- FUNGSI KIRIM DATA KE FIREBASE ---
        async function handleSimpanKeFirebase(e) {
            e.preventDefault();
            const sigData = sigCanvas.toDataURL();
            
            if (sigData.length < 2000) return showToast("Tanda tangan wajib diisi!", "error");
            if (!navigator.onLine) return showToast("Gagal! Anda sedang offline.", "error");
            
            toggleLoader(true, "Mengunggah Data...");
            
            const guest = {
                id: 'T-' + Math.random().toString(36).substr(2, 6).toUpperCase(),
                name: document.getElementById('fname').value,
                agency: document.getElementById('fagency').value,
                phone: document.getElementById('fphone').value || '-',
                purpose: document.getElementById('fpurpose').value,
                date: new Date().toISOString().split('T')[0],
                time: new Date().toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'}),
                signature: sigData,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };
            
            try {
                await dbFirestore.collection("tamu").add(guest);
                state.guests.unshift(guest);
                router.navigate('success', guest);
            } catch (error) {
                console.error(error);
                showToast("Gagal mendaftar", "error");
            } finally {
                toggleLoader(false);
            }
        }

        // --- KONTROL MENU & ACTION ---
        function toggleMenu(e) { if(e) e.stopPropagation(); document.getElementById('quick-menu').classList.toggle('hidden'); }
        function closeMenu() { const m = document.getElementById('quick-menu'); if(m && !m.classList.contains('hidden')) m.classList.add('hidden'); }
        document.addEventListener('click', (e) => {
            const mBtn = document.getElementById('menu-btn'); const m = document.getElementById('quick-menu');
            if(mBtn && m && !m.contains(e.target) && !mBtn.contains(e.target)) closeMenu();
        });

        async function handleAction(a) {
            closeMenu();
            if(a === 'excel') exportExcel();
            if(a === 'word') exportWord();
        }

        // --- SISTEM EXPORT ---
        function exportExcel() {
            if(!state.guests.length) return showToast("Data Kosong", "error");
            let csv = "ID,TANGGAL,WAKTU,NAMA,INSTANSI,NO_HP,KEPERLUAN\n";
            state.guests.forEach(g => csv += `${g.id},${g.date},${g.time},"${g.name}","${g.agency}","${g.phone}","${g.purpose}"\n`);
            saveAs(new Blob([csv], {type:'text/csv;charset=utf-8;'}), `Data_Tamu_SMK_${new Date().getTime()}.csv`);
            showToast("Excel Berhasil Diunduh");
        }

        async function exportWord() {
            if(!state.guests.length) return showToast("Data Kosong", "error");
            toggleLoader(true, "Menyusun Docx...");
            try {
                const { Document, Packer, Paragraph, Table, TableRow, TableCell, WidthType, TextRun } = docx;
                const rows = [
                    new TableRow({ children: [
                        new TableCell({children:[new Paragraph({children:[new TextRun({text:"TANGGAL", bold:true})]})]}), 
                        new TableCell({children:[new Paragraph({children:[new TextRun({text:"NAMA", bold:true})]})]}), 
                        new TableCell({children:[new Paragraph({children:[new TextRun({text:"INSTANSI", bold:true})]})]}),
                        new TableCell({children:[new Paragraph({children:[new TextRun({text:"NO HP", bold:true})]})]})
                    ]}),
                    ...state.guests.map(g => new TableRow({ children: [
                        new TableCell({children:[new Paragraph(g.date)]}), new TableCell({children:[new Paragraph(g.name)]}), new TableCell({children:[new Paragraph(g.agency)]}), new TableCell({children:[new Paragraph(g.phone)]})
                    ]}))
                ];
                const doc = new Document({ sections: [{ children: [new Paragraph({text:"LAPORAN BUKU TAMU SMK QUEEN AL-FALAH", heading:"Heading1"}), new Paragraph({text:"\n"}), new Table({width:{size:100, type:WidthType.PERCENTAGE}, rows})] }] });
                const blob = await Packer.toBlob(doc);
                saveAs(blob, `Laporan_Tamu_${new Date().getTime()}.docx`);
                showToast("Word Berhasil Diunduh");
            } catch(e) { showToast("Gagal Buat File", "error"); } finally { toggleLoader(false); }
        }
        
        // --- UI UTILS ---
        function showToast(m, type="success") { 
            const t = document.getElementById('toast'); const i = document.getElementById('toast-icon');
            document.getElementById('toast-msg').innerText = m; 
            i.innerText = type === "success" ? "check_circle" : "error";
            i.className = `material-icons text-sm ${type === "success" ? "text-green-400" : "text-red-400"}`;
            t.classList.remove('hidden'); setTimeout(()=>t.classList.add('hidden'), 2500); 
        }
        function toggleLoader(s, t) { document.getElementById('loader').classList.toggle('hidden', !s); if(t) document.getElementById('loader-text').innerText = t; }

        function updateOnlineStatus() {
            const b = document.getElementById('status-badge');
            const isO = navigator.onLine;
            b.innerText = isO ? "Online Server" : "Offline";
            b.className = `px-2 py-1 ${isO ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'} text-[8px] font-black rounded-md transition-all uppercase shadow-sm`;
        }

        // --- INITIALIZATION TERKUNCI ---
        window.onload = () => {
            // EKSEKUSI GUEST MODE (MENGHILANGKAN NAVIGASI ADMIN)
            if (isGuestMode) {
                document.getElementById('main-nav').style.display = 'none';
                document.getElementById('menu-btn').style.display = 'none';
                router.navigate('form');
            } else {
                fetchDataDariFirebase();
                const initView = window.location.hash.substring(1) || 'dashboard';
                router.navigate(initView === 'success' ? 'dashboard' : initView);
            }
            
            updateOnlineStatus();
            window.addEventListener('online', updateOnlineStatus);
            window.addEventListener('offline', updateOnlineStatus);
        };
    </script>
</body>
</html>
